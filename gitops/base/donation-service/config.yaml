apiVersion: v1
kind: ConfigMap
metadata:
  name: donation-config
data:
  PORT: "8082"
  AWS_REGION: us-east-1
  AWS_SQS_URL: https://sqs.us-east-1.amazonaws.com/376903139600/solidarytech-donation-events
---
apiVersion: v1
kind: Service
metadata:
  name: donation-service
spec:
  selector:
    app: donation-service
  ports:
    - port: 8082
      targetPort: 8082
