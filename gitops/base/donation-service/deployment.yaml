apiVersion: apps/v1
kind: Deployment
metadata:
  name: donation-service
  labels:
    app: donation-service
    app.kubernetes.io/part-of: solidarytech
spec:
  replicas: 2
  selector:
    matchLabels:
      app: donation-service
  template:
    metadata:
      labels:
        app: donation-service
        app.kubernetes.io/part-of: solidarytech
    spec:
      serviceAccountName: donation-sa
      priorityClassName: solidarytech-critical
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: donation-service
      containers:
        - name: donation-service
          image: 376903139600.dkr.ecr.us-east-1.amazonaws.com/solidarytech/donation-service:latest
          ports:
            - containerPort: 8082
          envFrom:
            - configMapRef:
                name: donation-config
            - secretRef:
                name: donation-secret
          readinessProbe:
            httpGet:
              path: /health
              port: 8082
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8082
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
