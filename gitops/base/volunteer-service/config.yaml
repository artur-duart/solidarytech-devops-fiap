apiVersion: v1
kind: ConfigMap
metadata:
  name: volunteer-config
data:
  PORT: "8083"
  AWS_REGION: us-east-1
  AWS_DYNAMODB_TABLE: SolidaryTechVolunteers
---
apiVersion: v1
kind: Service
metadata:
  name: volunteer-service
spec:
  selector:
    app: volunteer-service
  ports:
    - port: 8083
      targetPort: 8083
