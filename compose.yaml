name: solidarytech

services:
  postgres:
    image: postgres:17.10-alpine
    environment:
      POSTGRES_USER: solidary
      POSTGRES_PASSWORD: solidary-local
    volumes:
      - ./local/postgres/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
      - ./ngo-service/db/init.sql:/schemas/ngo_db.sql:ro
      - ./donation-service/db/init.sql:/schemas/donation_db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U solidary -d donation_db"]
      interval: 3s
      retries: 20

  dynamodb:
    image: amazon/dynamodb-local:3.3.2
    command: ["-jar", "DynamoDBLocal.jar", "-inMemory"]

  dynamodb-init:
    image: amazon/aws-cli:2.39.0
    depends_on: [dynamodb]
    environment:
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      AWS_REGION: us-east-1
    entrypoint: ["sh", "-c"]
    command:
      - >
        until aws dynamodb list-tables --endpoint-url http://dynamodb:8000 >/dev/null 2>&1; do sleep 1; done;
        aws dynamodb describe-table --endpoint-url http://dynamodb:8000 --table-name SolidaryTechVolunteers >/dev/null 2>&1 ||
        aws dynamodb create-table --endpoint-url http://dynamodb:8000
        --table-name SolidaryTechVolunteers
        --attribute-definitions AttributeName=volunteer_id,AttributeType=S
        --key-schema AttributeName=volunteer_id,KeyType=HASH
        --billing-mode PAY_PER_REQUEST >/dev/null && echo tabela criada

  ngo-service:
    build: ./ngo-service
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://solidary:solidary-local@postgres:5432/ngo_db
    ports: ["8081:8081"]

  donation-service:
    build: ./donation-service
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://solidary:solidary-local@postgres:5432/donation_db
    ports: ["8082:8082"]

  volunteer-service:
    build: ./volunteer-service
    depends_on:
      dynamodb-init:
        condition: service_completed_successfully
    environment:
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      AWS_ENDPOINT_URL_DYNAMODB: http://dynamodb:8000
      AWS_DYNAMODB_TABLE: SolidaryTechVolunteers
    ports: ["8083:8083"]
