name: reusable-python-ci

on:
  workflow_call:
    inputs:
      service:
        required: true
        type: string
      python-version:
        required: false
        type: string
        default: "3.14"

env:
  AWS_REGION: us-east-1
  AWS_ROLE_ARN: arn:aws:iam::376903139600:role/solidarytech-github-actions
  ECR_REGISTRY: 376903139600.dkr.ecr.us-east-1.amazonaws.com
  IMAGE_NAME: solidarytech/${{ inputs.service }}

jobs:
  build-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.service }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ inputs.python-version }}
          cache: pip
          cache-dependency-path: |
            ${{ inputs.service }}/requirements.txt
            ${{ inputs.service }}/requirements-dev.txt

      - name: Install deps
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Unit Test
        run: pytest -q

  lint:
    runs-on: ubuntu-latest
    needs: build-test
    defaults:
      run:
        working-directory: ${{ inputs.service }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ inputs.python-version }}

      - name: Install flake8
        run: pip install flake8

      - name: Lint (erros reais)
        run: flake8 . --select=E9,F63,F7,F82 --show-source

  security:
    runs-on: ubuntu-latest
    needs: lint
    defaults:
      run:
        working-directory: ${{ inputs.service }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ inputs.python-version }}

      - name: bandit (SAST)
        run: |
          pip install bandit
          bandit -r . --severity-level high

      - name: Trivy (SCA)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: ${{ inputs.service }}
          severity: CRITICAL
          exit-code: "1"

  sbom:
    runs-on: ubuntu-latest
    needs: security
    steps:
      - uses: actions/checkout@v7

      - name: Generate SBOM (CycloneDX)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: ${{ inputs.service }}
          format: cyclonedx
          output: sbom-${{ inputs.service }}.cdx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v7
        with:
          name: sbom-${{ inputs.service }}
          path: sbom-${{ inputs.service }}.cdx.json

  build-push:
    runs-on: ubuntu-latest
    needs: security
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build image
        run: docker build -t "$ECR_REGISTRY/$IMAGE_NAME:$GITHUB_SHA" "${{ inputs.service }}"

      - name: Scan image (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.ECR_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Push image
        run: docker push "$ECR_REGISTRY/$IMAGE_NAME:$GITHUB_SHA"

  update-manifest:
    runs-on: ubuntu-latest
    needs: build-push
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    concurrency:
      group: gitops-manifest
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Install kustomize
        run: |
          curl -sfLo kustomize.tar.gz https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.4.3/kustomize_v5.4.3_linux_amd64.tar.gz
          tar -xzf kustomize.tar.gz
          sudo mv kustomize /usr/local/bin/

      - name: Set image tag in manifest
        working-directory: gitops/base/${{ inputs.service }}
        run: kustomize edit set image "$ECR_REGISTRY/$IMAGE_NAME=$ECR_REGISTRY/$IMAGE_NAME:$GITHUB_SHA"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add gitops/base/${{ inputs.service }}/kustomization.yaml
          git diff --cached --quiet && exit 0
          git commit -m "chore(gitops): ${{ inputs.service }} -> ${{ github.sha }} [skip ci]"
          git pull --rebase origin main
          git push
